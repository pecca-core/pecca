governance:
  transitions:
    "record->shadow":
      gates: ["cv_metric >= 0.85", "rows >= 2000"]
    "shadow->live":
      gates: ["agreement >= 0.90", "shadow_days >= 14"]
      approvals: {groups: [ml-leads], require: all, via: manual}
      evidence: [model_card, confusion_matrix, data_lineage, threshold_rationale]
  retention: {evidence: 3y, logs: 2y, signed: false}
  schedule:
    revalidate: {every: 365d}
    drift_review: {every: 30d}
