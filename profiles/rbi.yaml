governance:
  transitions:
    "record->shadow":
      gates: ["cv_metric >= 0.85", "rows >= 2000"]
      controls: ["RBI-<clause>"]
    "shadow->live":
      gates: ["agreement >= 0.90", "shadow_days >= 14"]
      approvals: {groups: [model-risk, business-owner], require: all, via: manual}
      evidence: [model_card, confusion_matrix, data_lineage, threshold_rationale, calibration, per_class_report, drift_report]
      controls: ["RBI-<clause>"]
  retention: {evidence: 7y, logs: 2y, signed: true}
  schedule:
    revalidate: {every: 365d}
    drift_review: {every: 30d}
