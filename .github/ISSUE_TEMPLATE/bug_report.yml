name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: "What did you expect instead?"}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce, description: "Commands or code; use synthetic data only", render: shell}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: "Pecca version (`pecca version`)"}
  - type: input
    id: env
    attributes: {label: "Python version and OS"}
  - type: textarea
    id: logs
    attributes: {label: Output / traceback, render: text}
