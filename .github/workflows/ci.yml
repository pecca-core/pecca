name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

env:
  PECCA_TEST_SMALL: "1"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  test:
    name: test (py${{ matrix.python }}, ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml

  # Visibility for the intermittent macOS exit-134 abort seen locally; never blocks a merge.
  test-macos:
    name: test (py3.11, macos, non-blocking)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: brew install libomp
      - run: uv sync --all-extras --dev
      - run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --extra mlflow --dev
      - run: uv run python scripts/gen_docs.py
      - run: git diff --exit-code docs/cli.md docs/config/pecca-yaml.md
      - run: uv run mkdocs build --strict

  notebooks:
    runs-on: ubuntu-latest
    env:
      PECCA_SKIP_DOCKER: "1"   # Docker-based cells are skipped in CI
      PECCA_TEST_SMALL: "1"
      PYTHONWARNINGS: ignore   # framework warnings embed the runner's venv path, which the notebook leak check rejects
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --extra mlflow --dev
      - run: uv pip install huggingface_hub requests respx pyyaml hvac boto3 "moto[secretsmanager]" "psycopg[binary]" langgraph langchain-core strands-agents google-adk openai-agents claude-agent-sdk
      - run: uv run python scripts/run_notebooks.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv build
      - run: uv run --with twine twine check dist/*

  # Single required status check for branch protection.
  ci:
    name: ci
    if: always()
    needs: [test, docs, notebooks, build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
