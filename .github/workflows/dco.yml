name: dco
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: christophebedard/dco-check@0.5.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bot commits cannot carry a sign-off; Dependabot bumps are reviewed before merge.
          DCO_CHECK_EXCLUDE_EMAILS: "49699333+dependabot[bot]@users.noreply.github.com"
