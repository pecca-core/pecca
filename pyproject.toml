[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pecca"
dynamic = ["version"]
description = "Replace repetitive LLM calls with small, auditable ML models. Record → Shadow → Live, LLM kept as fallback."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Fazil Ahamed", email = "fazilahamed@gmail.com" }]
keywords = ["llm", "mlops", "model-distillation", "text-classification", "ai-governance", "onnx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "scikit-learn",
  "lightgbm",
  "transformers",
  "torch",
  "sentence-transformers",
  "onnx",
  "onnxruntime",
  "skl2onnx",
  "langdetect",
  "typer",
  "rich",
  "pyyaml",
  "jinja2",
  "jsonschema",
  "httpx",
  "matplotlib",
  "psycopg[binary]",
  "mcp>=2,<3",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp",
]

[project.optional-dependencies]
gpu = []
databricks = ["databricks-sql-connector", "databricks-sdk", "mlflow"]
snowflake = ["snowflake-connector-python"]
bigquery = ["google-cloud-bigquery"]
wandb = ["wandb"]
mlflow = ["mlflow"]
vault = ["hvac"]
aws = ["boto3"]
pdf = ["weasyprint", "markdown"]
all = ["pecca[databricks,snowflake,bigquery,wandb,mlflow,vault,aws,pdf]"]

[project.scripts]
pecca = "pecca.cli.main:app"

[project.urls]
Homepage = "https://pecca-core.github.io/pecca"
Repository = "https://github.com/pecca-core/pecca"

[dependency-groups]
dev = [
  "pytest", "pytest-cov", "hypothesis", "respx", "freezegun", "moto[s3,secretsmanager]",
  "ruff", "mypy", "pre-commit", "twine", "build",
  "mkdocs-material", "mkdocstrings[python]", "mkdocs-mermaid2-plugin",
  "nbconvert", "ipykernel", "types-PyYAML", "types-jsonschema", "pandas-stubs",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.hatch.version]
path = "src/pecca/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pecca"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "pecca/profiles"

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]  # demo notebooks are not linted
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # `ruff format` wraps code; long docstrings/comments are fine

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "SIM115", "E741", "E402", "B017", "E731", "B905", "F841", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
ignore_missing_imports = true
files = ["src"]

# These modules wrap optional third-party packages that may or may not be installed.
[[tool.mypy.overrides]]
module = ["pecca.connectors.registry._pyfunc", "pecca.connectors.datasource.databricks"]
disallow_subclassing_any = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pecca"]
branch = true

[tool.coverage.report]
show_missing = true
